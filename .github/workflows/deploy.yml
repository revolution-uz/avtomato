name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy Production
    runs-on: self-hosted
    steps:
      - name: Deploy to Production server
        uses: appleboy/ssh-action@master
        with:
          host: 10.20.30.100
          script_stop: true
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S su - www-data -s /bin/bash -c 'cd /var/www/automato/ && git reset --hard && git pull'
            cd /var/www/automato/ && echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S sh deploy.sh
      - name: send message on success
        uses: appleboy/discord-action@master
        if: ${{ success() }}
        with:
          webhook_id: ${{ secrets.WEBHOOK_ID }}
          webhook_token: ${{ secrets.WEBHOOK_TOKEN }}
          args: |
            ✅ User **${{github.actor}}** pushed to master branch in `${{ github.repository }}` repository and changes deployed to server. 

            Last commit: ${{ github.event.head_commit.message }}

            Last commit link: https://github.com/${{ github.repository }}/commit/${{github.sha}}
      - name: send message on failure
        uses: appleboy/discord-action@master
        if: ${{ failure() }}
        with:
          webhook_id: ${{ secrets.WEBHOOK_ID }}
          webhook_token: ${{ secrets.WEBHOOK_TOKEN }}
          args: |
            ❌ User **${{github.actor}}** pushed to master branch in `${{ github.repository }}` repository and deploy pipeline is broken. 

            Last commit: ${{ github.event.head_commit.message }}

            Last commit link: https://github.com/${{ github.repository }}/commit/${{github.sha}}