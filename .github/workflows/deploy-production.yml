name: Deploy Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy Production
    runs-on: deployer
    steps:
      - name: Connect to ssh and run deploy script
        run: |
          ssh root@10.20.30.100 -p 7111 "
            sudo -S su - www-data -s /bin/bash -c 'cd /var/www/automato/ && git reset --hard && git pull'
            cd /var/www/automato/ && sudo -S sh deploy.sh
            "
      - name: send telegram message on deploy
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            User **${{github.actor}}** merged/pushed in `${{ github.repository }}` repository to production and run deploy. 

            Last commit: ${{ github.event.commit.message }}