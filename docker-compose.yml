version: "3.8"
services:
    redis:
        image: redis:alpine
        container_name: ${APP_NAME}-redis
    postgres:
        image: postgres:alpine3.18
        container_name: ${APP_NAME}-postgres
        volumes:
            - volume-postgres:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_DATABASE}
        ports:
            - "5432:5432"
        networks:
            - app-network
    nginx:
        image: nginx:alpine
        container_name: ${APP_NAME}-nginx
        restart: unless-stopped
        tty: true
        ports:
            - '8000:80'
        volumes:
            - ./:/app
            - ./docker/nginx:/etc/nginx/conf.d/
        networks:
            - app-network
    php-fpm:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: ${APP_NAME}-php:8.1-fpm
        container_name: ${APP_NAME}-php
        command: sh -c "chown user -R /app && chmod 775 -R /app && php-fpm"
        restart: unless-stopped
        tty: true
        working_dir: /app
        volumes:
            - ./:/app
            - ./docker/php:/usr/local/etc/php/conf.d
            - ./docker/php-fpm.d:/usr/local/etc/php-fpm.d
        networks:
            - app-network
networks:
    app-network:
        driver: bridge
volumes:
    volume-postgres:
        driver: local
