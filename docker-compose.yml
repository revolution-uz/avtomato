version: "3.8"
services:
    avtomato-redis:
        image: redis:alpine
        container_name: avtomato-redis
        networks:
            - app-network
    avtomato-db:
        image: postgres:alpine3.18
        container_name: avtomato-db
        volumes:
            - volume-postgres:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_DATABASE}
        ports:
            - "5432:5432"
        networks:
            - app-network
    avtomato-nginx:
        image: nginx:alpine
        container_name: avtomato-nginx
        restart: unless-stopped
        tty: true
        ports:
            - '80:80'
        volumes:
            - ./:/var/www/application
            - ./docker/nginx:/etc/nginx/conf.d/
        networks:
            - app-network
    avtomato-app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: php
        container_name: avtomato-app
        extra_hosts:
            - "internal.host:host-gateway"
        restart: unless-stopped
        tty: true
        volumes:
            - ./:/var/www/application
        networks:
            - app-network
    avtomato-horizon:
        image: php
        container_name: avtomato-horizon
        command: php artisan horizon > /var/www/application/storage/logs/horizon.log
        volumes:
            - ./:/var/www/application
        networks:
            - app-network
        depends_on:
            - avtomato-app
            - avtomato-db
            - avtomato-redis
networks:
    app-network:
        driver: bridge
volumes:
    volume-postgres:
        driver: local
